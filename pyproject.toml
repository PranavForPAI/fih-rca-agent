[project]
name = "fhi-rca-agent"
version = "0.1.0"
description = "FHI RCA Chat Agent — Generic Postgres Root Cause Analysis Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=2.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "sqlglot>=23.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
